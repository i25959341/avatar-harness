name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install quality tools
        run: python -m pip install pytest==8.4.2 ruff==0.15.12
      - name: Lint
        run: ruff check .
      - name: Unit tests
        run: python -m pytest
