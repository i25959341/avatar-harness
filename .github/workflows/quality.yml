name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install \
            httpx==0.28.1 \
            livekit-agents==1.6.7 \
            numpy==1.26.4 \
            opencv-python-headless==4.11.0.86 \
            pytest==8.4.2 \
            ruff==0.15.12
      - name: Lint
        run: ruff check .
      - name: Unit tests
        run: python -m pytest
